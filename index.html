<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фотогалерея объектов — АМК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FDC500; --grey:#9D9D9C; --grey-dark:#575756; --grey-light:#DADADA; --black:#1D1D1B;
  --gap:clamp(10px,1.6vw,20px); --pad:clamp(16px,4vw,56px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Onest,Arial,sans-serif;background:#fff;color:var(--black);line-height:1.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--black);outline-offset:3px}

/* Шапка */
.top{background:#fff;color:var(--black);padding:var(--pad);padding-top:clamp(14px,2vw,24px);padding-bottom:clamp(16px,2.5vw,32px)}
.back{display:inline-block;color:var(--grey-dark);font-size:15px;margin-bottom:clamp(14px,2.5vw,28px);transition:color .2s}
.back:hover{color:var(--black)}
.top h1{font-family:Unbounded,Arial,sans-serif;font-weight:600;font-size:clamp(24px,4.6vw,56px);line-height:1.05;max-width:14em}
.top p{margin-top:12px;color:var(--grey-dark);max-width:34em;font-size:clamp(15px,1.6vw,18px)}
.bar{height:8px;background:var(--black)}

/* Фото лежат в колонках; на десктопе расстановка по колонкам зафиксирована как в макете (см. LAYOUT3 в скрипте) */
.gallery{padding:clamp(16px,2.4vw,32px) var(--pad) var(--pad);max-width:1600px;margin:0 auto;display:flex;align-items:flex-start;gap:var(--gap)}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.ph{overflow:hidden;background:var(--grey-light);
  opacity:0;transform:translateY(28px) scale(.97);
  transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.ph.in{opacity:1;transform:none}
.ph img{width:100%;height:auto;display:block;transition:transform .6s}
.ph:hover img{transform:scale(1.04)}

.bottom{display:flex;justify-content:center;padding:clamp(8px,2vw,24px) var(--pad) clamp(40px,6vw,80px)}
.up{display:inline-flex;align-items:center;gap:12px;background:var(--black);color:#fff;border:0;border-radius:4px;cursor:pointer;
  font-family:Unbounded,Arial,sans-serif;font-weight:500;font-size:clamp(14px,1.6vw,18px);padding:18px 32px;transition:background .25s,color .25s}
.up:hover,.up:focus-visible{background:var(--grey-dark);color:#fff}

.ph{cursor:zoom-in}

/* Просмотр фото (лайтбокс) */
.lb{position:fixed;inset:0;z-index:100;background:rgba(29,29,27,.96);display:flex;align-items:center;justify-content:center;padding:clamp(56px,8vw,80px) clamp(12px,6vw,96px);animation:lbin .25s ease}
.lb[hidden]{display:none}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .25s;user-select:none;-webkit-user-drag:none}
.lb-btn{position:absolute;background:none;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;font-size:30px;line-height:1;transition:background .2s,color .2s}
.lb-btn:hover,.lb-btn:focus-visible{background:var(--yellow);color:var(--black)}
.lb :focus-visible{outline:3px solid var(--yellow)}
.lb-close{top:12px;right:12px}
.lb-prev,.lb-next{top:50%;transform:translateY(-50%)}
.lb-prev{left:clamp(4px,1.5vw,20px)}
.lb-next{right:clamp(4px,1.5vw,20px)}
.lb-info{position:absolute;left:0;right:0;bottom:0;padding:14px 72px 18px;text-align:center;color:#fff;font-size:clamp(13px,1.4vw,16px)}
.lb-info small{display:block;color:var(--grey);font-size:13px;margin-top:2px}
@media (max-width:560px){.lb{padding:56px 0 72px}.lb-prev,.lb-next{top:auto;bottom:10px;transform:none}.lb-info{padding:14px 64px 18px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .ph{opacity:1;transform:none;transition:none}
  .lb{animation:none}.lb-img{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="/">← На главную</a>
  <h1>Объекты с АМК</h1>
  <p>Фотографии реализованных проектов.</p>
</header>
<div class="bar"></div>

<main>
  <section class="gallery" id="gallery" aria-label="Фотографии объектов"></section>
</main>

<div class="bottom"><button class="up" type="button" id="toTop">↑ Наверх</button></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Просмотр фотографии" hidden>
  <button class="lb-btn lb-close" type="button" id="lbClose" aria-label="Закрыть">✕</button>
  <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="Предыдущее фото">←</button>
  <img class="lb-img" id="lbImg" alt="">
  <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="Следующее фото">→</button>
  <div class="lb-info"><span id="lbCap"></span><small id="lbCount"></small></div>
</div>

<script>
/* Фото: [файл, ширина, высота, подпись]. Чтобы добавить новые — допишите строки в конец списка. */
const photos = [["img/obj-01.jpg", 1500, 900, "Блок (цвет 101)"], ["img/obj-02.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-03.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-04.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-05.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-06.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-07.jpg", 1500, 900, "Кирпич (цвет 001, 101)"], ["img/obj-08.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-09.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-10.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-11.jpg", 1500, 900, "Кирпич (микс 100, 303)"], ["img/obj-12.jpg", 1500, 900, "Блок (цвет 101)"], ["img/obj-13.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-14.jpg", 1500, 1500, "Кирпич (микс 200)"], ["img/obj-15.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-16.jpg", 1500, 900, "Кирпич (микс 410)"], ["img/obj-17.jpg", 1500, 900, "Кирпич (микс 410, 303)"], ["img/obj-18.jpg", 1500, 1500, "Ригель (микс 500)"], ["img/obj-19.jpg", 1500, 1500, "Ригель (микс 500)"], ["img/obj-20.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-21.jpg", 1500, 1500, "Кирпич (микс 300)"], ["img/obj-22.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-23.jpg", 1500, 1500, "Кирпич (цвет 001, 101)"], ["img/obj-24.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-25.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-26.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-27.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-28.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-29.jpg", 1500, 1500, "Кирпич (микс 200)"], ["img/obj-30.jpg", 1500, 1500, "Кирпич (микс 432)"], ["img/obj-31.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-32.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-33.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-34.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-35.jpg", 1500, 900, "В интерьере: Кирпич (микс 200)"], ["img/obj-36.jpg", 1500, 900, "Кирпич (цвет 001)"], ["img/obj-37.jpg", 1500, 900, "В интерьере: Кирпич (микс 200)"], ["img/obj-38.jpg", 1500, 900, "На фасаде и цоколе: Кирпич (микс 200), Блок (микс 300)"], ["img/obj-39.jpg", 1500, 1500, "Кирпич (микс 100)"], ["img/obj-40.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-41.jpg", 1500, 900, "Блок (цвет 101)"], ["img/obj-42.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-43.jpg", 1500, 1500, "Кирпич (микс 100, 303)"], ["img/obj-44.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-45.jpg", 1500, 900, "Кирпич (микс 300)"], ["img/obj-46.jpg", 1500, 900, "Кирпич (микс 100, 303)"], ["img/obj-47.jpg", 1500, 900, "Кирпич (микс 102)"], ["img/obj-48.jpg", 1500, 900, "Блок (цвет 101)"], ["img/obj-49.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-50.jpg", 1500, 1500, "Кирпич (микс 432)"], ["img/obj-51.jpg", 1500, 1500, "Кирпич (микс 322)"], ["img/obj-52.jpg", 1500, 1500, "Кирпич (микс 241)"], ["img/obj-53.jpg", 1500, 900, "Кирпич (микс 200, 010)"], ["img/obj-54.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-55.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-56.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-57.jpg", 1500, 900, "На фасаде и заборе: Кирпич (микс 200)"], ["img/obj-58.jpg", 1500, 1500, "На балконе: Кирпич (микс 322)"], ["img/obj-59.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-60.jpg", 1500, 1500, "На балконе: Соты (микс 241)"], ["img/obj-61.jpg", 1500, 1500, "На фасаде и цоколе: Кирпич (цвет 202), Блок (цвет 203)"], ["img/obj-62.jpg", 1500, 1500, "Кирпич (микс 100)"], ["img/obj-63.jpg", 1500, 900, "Ригель (микс 200)"], ["img/obj-64.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-65.jpg", 1500, 900, "На фасаде и заборе: Кирпич (микс 200)"], ["img/obj-66.jpg", 1500, 900, "Кирпич (микс 200)"], ["img/obj-67.jpg", 1500, 1500, "На фасаде и цоколе: Кирпич (цвет 322), Кирпич (цвет 304)"], ["img/obj-68.jpg", 1500, 900, "Ригель (микс 322)"], ["img/obj-69.jpg", 1500, 900, "Кирпич (микс 432)"], ["img/obj-70.jpg", 1500, 900, "В интерьере: Кирпич (микс 322)"], ["img/obj-71.jpg", 1500, 1500, "Кирпич (микс 100)"], ["img/obj-72.jpg", 1500, 1500, "Кирпич (микс 322)"], ["img/obj-73.jpg", 1500, 900, "Кирпич (микс 322)"], ["img/obj-74.jpg", 1500, 900, "На балконе: Кирпич (цвет 001, 303)"], ["img/obj-75.jpg", 1500, 900, "Кирпич (микс 100)"], ["img/obj-76.jpg", 1500, 1500, "Кирпич (микс 241)"], ["img/obj-77.jpg", 1500, 900, "На заборе: Кирпич (цвет 101)"]];

document.getElementById('toTop').addEventListener('click', () => {
  scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' });
});

/* Ссылка «На главную»: на поддомене (photo.site.ru) ведёт на основной домен (site.ru) сама.
   Если нужен другой адрес, впишите его сюда, например 'https://site.ru/'. */
const HOME_URL = '';
(function () {
  const back = document.querySelector('.back');
  const parts = location.hostname.split('.');
  if (HOME_URL) back.href = HOME_URL;
  else if (parts.length > 2 && !/github\.io$/.test(location.hostname)) back.href = location.protocol + '//' + parts.slice(1).join('.') + '/';
})();

/* Просмотр фото: клик по фото, листание стрелками, свайпом, клавишами ← → и Esc */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'),
      lbCap = document.getElementById('lbCap'), lbCount = document.getElementById('lbCount');
let cur = 0, lastFocus = null;

function showLb(i) {
  cur = (i + photos.length) % photos.length;
  const [src, , , label] = photos[cur];
  lbImg.style.opacity = 0;
  lbImg.onload = () => { lbImg.style.opacity = 1; };
  lbImg.src = src;
  lbImg.alt = 'Объект, отделанный материалом АМК: ' + label;
  lbCap.textContent = label;
  lbCount.textContent = (cur + 1) + ' / ' + photos.length;
  [cur + 1, cur - 1].forEach((n) => { new Image().src = photos[(n + photos.length) % photos.length][0]; });
}
function openLb(i) {
  lastFocus = document.activeElement;
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  showLb(i);
  document.getElementById('lbClose').focus();
}
function closeLb() {
  lb.hidden = true;
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => showLb(cur - 1));
document.getElementById('lbNext').addEventListener('click', () => showLb(cur + 1));
lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', (e) => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') showLb(cur - 1);
  else if (e.key === 'ArrowRight') showLb(cur + 1);
});
let tx = null;
lb.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', (e) => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) showLb(cur + (dx < 0 ? 1 : -1));
});

const gallery = document.getElementById('gallery');
const items = photos.map(([src, w, h, label], idx) => {
  const el = document.createElement('figure');
  el.className = 'ph';
  el.tabIndex = 0; el.setAttribute('role', 'button');
  el.setAttribute('aria-label', 'Открыть фото: ' + label);
  el.addEventListener('click', () => openLb(idx));
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(idx); } });
  const img = new Image();
  img.src = src; img.width = w; img.height = h;
  img.alt = 'Объект, отделанный материалом АМК: ' + label;
  img.loading = 'lazy'; img.decoding = 'async';
  el.appendChild(img);
  return { el, ratio: h / w };
});

/* Макет на 3 колонки: номера фото (как в списке выше, с 1) по колонкам сверху вниз.
   Фото сверх этого списка (если допишете новые) автоматически встанут в самую короткую колонку. */
const LAYOUT3 = [
  [1,4,7,10,13,16,19,22,25,28,31,32,35,38,41,42,45,49,52,55,58,61,64,67,72,75],
  [2,5,8,11,14,17,20,23,26,29,33,36,39,43,46,50,53,56,59,62,65,68,70,73,76],
  [3,6,9,12,15,18,21,24,27,30,34,37,40,44,47,48,51,54,57,60,63,66,69,71,74,77]
];

function distribute(n) {
  const cols = Array.from({ length: n }, () => []);
  const hs = new Array(n).fill(0);
  const put = (i) => {
    const k = hs.indexOf(Math.min(...hs));
    cols[k].push(i); hs[k] += items[i].ratio + 0.04;
  };
  if (n === 3) {
    LAYOUT3.forEach((c, k) => c.forEach((num) => {
      if (num - 1 < items.length) { cols[k].push(num - 1); hs[k] += items[num - 1].ratio + 0.04; }
    }));
    for (let i = LAYOUT3.flat().length; i < items.length; i++) put(i);
  } else {
    items.forEach((_, i) => put(i)); /* планшет и телефон: по порядку, в самую короткую колонку */
  }
  return cols;
}

let colsNow = 0;
function render() {
  const n = innerWidth <= 560 ? 1 : innerWidth <= 900 ? 2 : 3;
  if (n === colsNow) return;
  colsNow = n;
  gallery.textContent = '';
  distribute(n).forEach((idxs, c) => {
    const col = document.createElement('div');
    col.className = 'col';
    idxs.forEach((i) => {
      items[i].el.style.transitionDelay = (c * 90) + 'ms'; /* появление слева направо */
      col.appendChild(items[i].el);
    });
    gallery.appendChild(col);
  });
}
render();
addEventListener('resize', render);

/* Плавное появление при скролле */
const targets = document.querySelectorAll('.ph');
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  targets.forEach((t) => io.observe(t));
} else {
  targets.forEach((t) => t.classList.add('in'));
}
</script>
</body>
</html>
